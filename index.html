<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d19">
  <title>Robo · Eye Display</title>
  <link rel="stylesheet" href="/eyes.css">
</head>
<body data-state="offline">
  <main class="face" aria-label="Robo animated eye display">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="hud">
      <div class="identity"><span class="brand-dot"></span><span>ROBO <small>SIT CAMPUS GUIDE</small></span></div>
      <div class="connection"><i></i><span id="connection-label">CONNECTING</span></div>
    </header>
    <section class="eyes-wrap" aria-live="polite" aria-label="Robot expression">
      <div class="visor-shell">
        <div class="hardware-label"><span class="label-status"></span><strong>ROBO <i>·</i> OPTIC SYSTEM</strong><small>MK–01</small></div>
        <div class="faceplate">
          <div class="eyes">
            <div class="eye-frame left-eye"><div class="eye"><div class="iris"><div class="pupil"></div><i class="shine shine-large"></i><i class="shine shine-small"></i></div><div class="lid"></div></div></div>
            <div class="eye-frame right-eye"><div class="eye"><div class="iris"><div class="pupil"></div><i class="shine shine-large"></i><i class="shine shine-small"></i></div><div class="lid"></div></div></div>
          </div>
        </div>
        <div class="hardware-footer"><span></span><small>EMO MOTION CORE</small><b>● <i>●</i> <i>●</i></b></div>
      </div>
      <div class="under-glow"></div>
    </section>
    <footer class="state-line"><span class="state-pulse"></span><span id="state-label">Robo is resting</span></footer>
    <div class="controls" id="controls"><a href="http://127.0.0.1:8765/" title="Open this computer’s Robo Brain">↖ <span>LOCAL ROBO BRAIN</span></a><button id="fullscreen" title="Enter fullscreen">⛶ <span>FULL SCREEN</span></button></div>
    <div class="hint" id="hint">Click Full Screen · press F to toggle · Esc to exit</div>
  </main>
  <script src="/eyes.js" defer></script>
</body>
</html>
